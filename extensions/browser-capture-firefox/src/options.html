<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>LLM Wiki Capture — Options</title>
  <style>
    body { font-family: sans-serif; max-width: 440px; padding: 20px; }
    h2 { font-size: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; }
    input[type="url"], input[type="password"] {
      width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; margin-bottom: 12px;
    }
    button { padding: 8px 16px; font-size: 13px; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; }
    #status.ok { color: green; }
    #status.err { color: red; }
    .note { font-size: 11px; color: #666; margin-bottom: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>LLM Wiki Capture — 설정</h2>

  <label for="capture-url">Capture API URL</label>
  <input type="url" id="capture-url" placeholder="http://192.168.x.x:5055" />
  <p class="note">
    Mac mini가 127.0.0.1:5055로 바인딩된 경우 Windows Firefox에서는 직접 접근할 수 없습니다.<br>
    LAN IP, Tailscale IP, 또는 포트포워딩 주소를 사용하세요.<br>
    예: <code>http://192.168.1.10:5055</code> 또는 <code>http://100.x.x.x:5055</code>
  </p>

  <label for="capture-token">Capture API Token</label>
  <input type="password" id="capture-token" placeholder="토큰 입력" autocomplete="off" />

  <button id="btn-save">저장</button>
  <div id="status"></div>
  <script src="../shared/browserCompat.js"></script>
  <script src="options.js"></script>
</body>
</html>
